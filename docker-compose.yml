# One-off build: compiles the site and writes the static files to OUTPUT_DIR,
# then exits. Nothing keeps running; your existing nginx (SWAG) serves the files.
#
#   OUTPUT_DIR=/path/to/swag/config/www/toastyourtime docker compose run --rm build
#
# OUTPUT_DIR can also be set in a .env file next to this one.
services:
  build:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      # Keep node_modules inside the container instead of the host checkout.
      - /app/node_modules
      - ${OUTPUT_DIR:?Set OUTPUT_DIR to the folder nginx serves the site from}:/app/dist
    command: sh -c "npm ci --no-audit --no-fund && npm run build"
