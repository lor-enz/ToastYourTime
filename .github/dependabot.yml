# Monthly dependency updates. The deploy workflow test-builds every PR,
# so an update is safe to merge once its check is green.
# Every update PR is assigned to lor-enz, so it shows up as a phone notification.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    assignees: ["lor-enz"]
    commit-message:
      prefix: "⬆️"
    groups:
      # One PR for all minor and patch updates; major updates get their own.
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    assignees: ["lor-enz"]
    commit-message:
      prefix: "⬆️"
    groups:
      github-actions:
        patterns: ["*"]
