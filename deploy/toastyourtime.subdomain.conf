## ToastYourTime: serves the static build written by `docker compose run --rm build`.
##
## Copy to SWAG's /config/nginx/site-confs/ and adjust server_name and root.
## root is the path *inside* the SWAG container; on the host it's the folder you
## pass as OUTPUT_DIR (e.g. <swag config>/www/toastyourtime).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name toastyourtime.*;

    include /config/nginx/ssl.conf;

    root /config/www/toastyourtime;
    index index.html;

    location / {
        # Share links like /19900101_1200 have no file behind them: serve the app,
        # which reads the date from the URL.
        try_files $uri /index.html;
    }

    # File names in /assets change with every build, so they can be cached long-term.
    location /assets/ {
        expires 1y;
    }
}
